  - openshift-cert-manager-operator v1.20.0 (OLMv0, Subscription)

  - openshift-gitops-operator v1.21.6 (OLMv0, Subscription)

  - openshift-pipelines-operator-rh v1.22.0 (OLMv1, ClusterExtension)


  Report the total operators checked and whether all are compatible

  with OCP 4.21.

  '
response_schema: '{"type": "object", "properties": {"operators_checked": {"type": "integer", "description":
