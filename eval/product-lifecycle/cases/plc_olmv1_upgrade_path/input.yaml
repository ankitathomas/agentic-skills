query: 'The operator serverless-operator v1.36.1 is installed as OLMv1

  (ClusterExtension-managed) on a cluster targeting OCP 4.21. This

  version is end of life and NOT compatible with OCP 4.21.


  Use the product-lifecycle skill with --compatibleonly to find

  compatible versions.


  Report whether the current version is compatible, the lifecycle

  status, and which compatible versions are available according to

  the lifecycle data.

  '
