query: 'Use the product-lifecycle skill to check lifecycle data for these

  OLMv1 (ClusterExtension-managed) operators against OCP 4.21:


  - openshift-pipelines-operator-rh v1.22.0

  - serverless-operator v1.36.1

  - istio-workspace-operator v0.5.2


  Report how many were checked, how many have lifecycle data,

  and whether any are incompatible with OCP 4.21.

  '
response_schema: '{"type": "object", "properties": {"operators_checked": {"type": "integer", "description":
  "Total number of operators checked"}, "operators_found": {"type": "integer", "description": "Number
  of operators with lifecycle data in the PLC API"}, "any_incompatible": {"type": "boolean", "description":
  "Whether any operator with lifecycle data is incompatible with OCP 4.21 (ocp_compatible=false)"}}, "required":
  ["operators_checked", "operators_found", "any_incompatible"]}'
